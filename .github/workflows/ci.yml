name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CXX: g++-13
  CC: gcc-13

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ./build/oms_tests

      - name: Smoke test sor_example
        run: ./build/sor_example

      - name: Smoke test oms_example
        run: echo "yes" | ./build/oms_example

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13

      - name: Configure (Debug, sanitizers only build under this config)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build ASan/UBSan target
        run: cmake --build build --target oms_example_san --parallel

      - name: Run under ASan/UBSan
        run: echo "yes" | ./build/oms_example_san
